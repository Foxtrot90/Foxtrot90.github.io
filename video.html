<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Permanent+Marker&family=Rubik+Glitch+Pop&family=Rubik+Scribble&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Screen Video with Quote</title>
    <link rel="stylesheet" href="styles.css"> <!-- Link to the external CSS file -->
    <script src="script.js" defer></script>
</head>
<body>

<!-- Full-screen video element -->
<video id="videoPlayer" autoplay loop class="background-video"> <!-- Video will play automatically, loop, and be muted -->
<source src="videos/Truism_compressed.mp4" type="video/mp4"> <!-- Path to the video file -->
Your browser does not support the video tag. <!-- Fallback message for unsupported browsers -->
</video>

<!-- Centered text box with quote -->
<div id="textbox" class="text-box">
<p>EATING TOO MUCH IS CRIMINAL</p> <!-- Text of the quote -->
</div>
</body>
</html>
